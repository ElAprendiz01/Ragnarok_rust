[package]
name = "ragnarok"
version = "0.1.0"
edition = "2021"
default-run = "ragnarok"
description = "Ragnarok - High Performance Video Pipeline and Distribution Engine"

[dependencies]
# Asincronía y Concurrencia
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Serialización y Datos
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Manejo de Errores y Logs
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Red y HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Servidor Web Liviano para Panel y Streaming Local (HTTP 206)
axum = { version = "0.7", features = ["tokio", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tokio-tungstenite = { version = "0.21", features = ["connect"] }

# Telegram MTProto Puro (Zero-RAM, sin navegador)
grammers-client = "0.7"
grammers-session = "0.7"
grammers-tl-types = "0.7"

# Expresiones Regulares y Utilidades
regex = "1.10"
dirs = "5.0"
md5 = "0.7"
